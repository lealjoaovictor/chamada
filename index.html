<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Chamada</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #renderCanvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      .tela { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: rgba(235, 235, 230, 0.8); font-family: Georgia, "Times New Roman", serif; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; user-select: none; z-index: 10; }
      .tela.visivel { opacity: 1; }
      .tela.menu { background: rgba(0, 0, 0, 0.35); }
      .tela.fim { background: #000; }
      .tela .titulo { font-size: clamp(16px, 2.4vw, 26px); letter-spacing: 0.6em; margin-right: -0.6em; text-transform: lowercase; }
      .tela .aperte { margin-top: 2.2em; font-size: clamp(11px, 1.3vw, 14px); letter-spacing: 0.3em; color: #ddd; animation: pulsa 2.4s ease-in-out infinite; }
      .tela .controles { position: absolute; bottom: 4vh; left: 0; right: 0; font-family: -apple-system, "Segoe UI", sans-serif; font-size: clamp(10px, 1vw, 12px); letter-spacing: 0.15em; color: rgba(220, 220, 215, 0.4); }
      .tela .creditos { margin-top: 3em; font-size: clamp(10px, 1.1vw, 13px); line-height: 2; letter-spacing: 0.12em; color: rgba(220, 220, 215, 0.5); }
      .tela.fim .aperte { position: absolute; bottom: 8vh; margin: 0; }
      .carregando { position: fixed; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: rgba(240, 190, 120, 0.8); animation: pulsa 1.4s ease-in-out infinite; z-index: 20; }
      .dica { position: fixed; left: 0; top: 0; min-width: 1.6em; padding: 0.25em 0.5em; border: 1.5px solid rgba(240, 200, 140, 0.85); border-radius: 0.35em; color: rgba(250, 230, 200, 0.95); background: rgba(0, 0, 0, 0.45); font-family: -apple-system, "Segoe UI", sans-serif; font-size: clamp(13px, 1.5vw, 18px); font-weight: 600; text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.6s ease; z-index: 5; }
      .dica.visivel { opacity: 1; animation: pulsa 1.6s ease-in-out infinite; }
      .toque { position: fixed; inset: auto 0 0 0; display: flex; justify-content: space-between; padding: 0 max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); pointer-events: none; z-index: 15; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      .toque-grupo { display: flex; gap: 14px; pointer-events: auto; }
      .toque-grupo.direita { flex-direction: row; }
      .toque-botao { width: 68px; height: 68px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: rgba(240, 225, 200, 0.75); background: rgba(20, 20, 24, 0.35); border: 1.5px solid rgba(240, 210, 160, 0.35); touch-action: none; }
      .toque-botao.ativo { background: rgba(240, 200, 140, 0.3); }
      .gesto-anel { position: fixed; top: 0; left: 0; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; border: 1.5px solid rgba(240, 210, 160, 0.5); pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 15; }
      .gesto-anel.visivel { opacity: 0.35; }
      .telemetria { position: fixed; top: 8px; left: 8px; padding: 6px 10px; white-space: pre; font: 12px/1.5 ui-monospace, Menlo, monospace; color: #e8e2d4; background: rgba(0, 0, 0, 0.6); border-radius: 4px; pointer-events: none; z-index: 30; }
      .ligacao { position: fixed; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); width: min(250px, 58vw); padding: 8px 11px 9px; border-radius: 12px; background: rgba(8, 9, 12, 0.55); border: 1px solid rgba(200, 215, 235, 0.12); color: rgba(225, 230, 235, 0.85); font-family: -apple-system, "Segoe UI", sans-serif; font-size: clamp(11px, 1.1vw, 13px); line-height: 1.35; pointer-events: none; user-select: none; opacity: 0; transition: opacity 0.8s ease; z-index: 6; }
      .ligacao.visivel { opacity: 1; }
      .lig-topo { display: flex; align-items: center; gap: 7px; font-size: 0.85em; letter-spacing: 0.08em; color: rgba(200, 210, 220, 0.6); }
      .lig-ponto { width: 6px; height: 6px; border-radius: 50%; background: #5fc77a; box-shadow: 0 0 6px #5fc77a; }
      .lig-nome { flex: 1; }
      .lig-sinal { display: flex; align-items: flex-end; gap: 2px; height: 13px; }
      .lig-sinal span { width: 3px; background: rgba(200, 210, 220, 0.2); border-radius: 1px; transition: background 0.2s; }
      .lig-sinal span.on { background: rgba(220, 230, 240, 0.8); }
      .lig-colega, .lig-prof { max-height: 0; overflow: hidden; opacity: 0; transition: opacity 0.4s ease, max-height 0.4s ease; }
      .lig-colega.visivel, .lig-prof.visivel { max-height: 5em; opacity: 1; margin-top: 5px; }
      .lig-colega { font-style: italic; color: rgba(240, 244, 248, 0.92); }
      .lig-prof { font-size: 0.88em; color: rgba(200, 205, 210, 0.6); }
      .legenda-sala { position: fixed; left: 0; right: 0; bottom: 12vh; text-align: center; color: rgba(245, 232, 210, 0.85); font-family: Georgia, "Times New Roman", serif; font-size: clamp(14px, 1.6vw, 19px); letter-spacing: 0.05em; pointer-events: none; opacity: 0; transition: opacity 0.6s ease; z-index: 6; }
      .legenda-sala.visivel { opacity: 1; }
      @keyframes pulsa { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="carregando" class="carregando"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
