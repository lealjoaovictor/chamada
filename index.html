<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Chamada</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #renderCanvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      .tela { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: rgba(235, 235, 230, 0.8); font-family: Georgia, "Times New Roman", serif; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; user-select: none; z-index: 10; }
      .tela.visivel { opacity: 1; }
      .tela.menu { background: rgba(0, 0, 0, 0.35); }
      .tela.fim { background: #000; }
      .tela .titulo { font-size: clamp(16px, 2.4vw, 26px); letter-spacing: 0.6em; margin-right: -0.6em; text-transform: lowercase; }
      .tela .aperte { margin-top: 2.2em; font-size: clamp(11px, 1.3vw, 14px); letter-spacing: 0.3em; color: #ddd; animation: pulsa 2.4s ease-in-out infinite; }
      .tela .controles { position: absolute; bottom: 4vh; left: 0; right: 0; font-family: -apple-system, "Segoe UI", sans-serif; font-size: clamp(10px, 1vw, 12px); letter-spacing: 0.15em; color: rgba(220, 220, 215, 0.4); }
      .tela .creditos { margin-top: 3em; font-size: clamp(10px, 1.1vw, 13px); line-height: 2; letter-spacing: 0.12em; color: rgba(220, 220, 215, 0.5); }
      .tela.fim .aperte { position: absolute; bottom: 8vh; margin: 0; }
      .carregando { position: fixed; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: rgba(240, 190, 120, 0.8); animation: pulsa 1.4s ease-in-out infinite; z-index: 20; }
      .dica { position: fixed; left: 0; top: 0; min-width: 1.6em; padding: 0.25em 0.5em; border: 1.5px solid rgba(240, 200, 140, 0.85); border-radius: 0.35em; color: rgba(250, 230, 200, 0.95); background: rgba(0, 0, 0, 0.45); font-family: -apple-system, "Segoe UI", sans-serif; font-size: clamp(13px, 1.5vw, 18px); font-weight: 600; text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.6s ease; z-index: 5; }
      .dica.visivel { opacity: 1; animation: pulsa 1.6s ease-in-out infinite; }
      .toque { position: fixed; inset: auto 0 0 0; display: flex; justify-content: space-between; padding: 0 max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); pointer-events: none; z-index: 15; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      .toque-grupo { display: flex; gap: 14px; pointer-events: auto; }
      .toque-grupo.direita { flex-direction: row; }
      .toque-botao { width: 68px; height: 68px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: rgba(240, 225, 200, 0.75); background: rgba(20, 20, 24, 0.35); border: 1.5px solid rgba(240, 210, 160, 0.35); touch-action: none; }
      .toque-botao.ativo { background: rgba(240, 200, 140, 0.3); }
      .gesto-anel { position: fixed; top: 0; left: 0; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; border: 1.5px solid rgba(240, 210, 160, 0.5); pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 15; }
      .gesto-anel.visivel { opacity: 0.35; }
      .telemetria { position: fixed; top: 8px; left: 8px; padding: 6px 10px; white-space: pre; font: 12px/1.5 ui-monospace, Menlo, monospace; color: #e8e2d4; background: rgba(0, 0, 0, 0.6); border-radius: 4px; pointer-events: none; z-index: 30; }
      .ligacao { position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); right: max(18px, env(safe-area-inset-right)); width: min(330px, 70vw); display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px 12px 12px; border-radius: 18px; background: rgba(48, 46, 46, 0.72); -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35); color: rgba(255, 255, 255, 0.92); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: clamp(12px, 1.15vw, 14px); line-height: 1.3; pointer-events: none; user-select: none; opacity: 0; transform: translateY(8px); transition: opacity 0.8s ease, transform 0.8s ease; z-index: 6; }
      .ligacao.visivel { opacity: 1; transform: none; }
      .lig-foto { position: relative; flex: none; width: 3.4em; height: 3.4em; }
      .lig-avatar { width: 100%; height: 100%; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #8c97a8, #4d5563); color: #fff; font-size: 1.45em; font-weight: 600; }
      .lig-selo { position: absolute; right: -0.15em; bottom: -0.15em; width: 1.35em; height: 1.35em; border-radius: 50%; background: #34c759; border: 2px solid rgba(48, 46, 46, 0.95); display: flex; align-items: center; justify-content: center; color: #fff; }
      .lig-selo svg { width: 62%; height: 62%; }
      .lig-corpo { flex: 1; min-width: 0; padding-top: 0.15em; }
      .lig-topo { display: flex; align-items: center; gap: 8px; }
      .lig-nome { flex: 1; font-weight: 700; font-size: 1.05em; color: #fff; }
      .lig-sinal { display: flex; align-items: flex-end; gap: 2px; height: 13px; }
      .lig-sinal span { width: 3px; background: rgba(255, 255, 255, 0.2); border-radius: 1px; transition: background 0.2s; }
      .lig-sinal span.on { background: rgba(255, 255, 255, 0.85); }
      .lig-status { margin-top: 2px; font-size: 1.05em; color: rgba(255, 255, 255, 0.6); max-height: 2em; overflow: hidden; transition: opacity 0.3s ease, max-height 0.3s ease; }
      .lig-status.oculto { opacity: 0; max-height: 0; margin-top: 0; }
      .lig-colega, .lig-prof { max-height: 0; overflow: hidden; opacity: 0; transition: opacity 0.4s ease, max-height 0.4s ease; }
      .lig-colega.visivel, .lig-prof.visivel { max-height: 6em; opacity: 1; margin-top: 3px; }
      .lig-colega { font-size: 1.05em; color: rgba(255, 255, 255, 0.95); }
      .lig-prof { font-size: 0.9em; color: rgba(255, 255, 255, 0.55); }
      .msg-hora { font-size: 0.85em; color: rgba(255, 255, 255, 0.45); }
      .msg-linha { max-height: 0; overflow: hidden; opacity: 0; font-size: 1.05em; color: rgba(255, 255, 255, 0.9); transition: opacity 0.35s ease, max-height 0.35s ease, margin-top 0.35s ease; }
      .msg-linha.visivel { max-height: 3em; opacity: 1; margin-top: 3px; }
      .tela.intro { justify-content: flex-start; padding-top: 22vh; transition: opacity 1.6s ease; }
      .tela.intro .titulo { font-size: clamp(22px, 3.4vw, 40px); text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6); }
      .legenda-sala { position: fixed; left: 0; right: 0; bottom: 12vh; text-align: center; color: rgba(245, 232, 210, 0.85); font-family: Georgia, "Times New Roman", serif; font-size: clamp(14px, 1.6vw, 19px); letter-spacing: 0.05em; pointer-events: none; opacity: 0; transition: opacity 0.6s ease; z-index: 6; }
      .legenda-sala.visivel { opacity: 1; }
      .gym-painel { position: fixed; left: 12px; top: 12px; width: 270px; padding: 10px 12px; border-radius: 10px; background: rgba(10, 11, 14, 0.82); color: #dfe3e8; font: 12px/1.35 -apple-system, "Segoe UI", sans-serif; z-index: 40; cursor: default; }
      .gym-titulo { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: #8b96a3; margin-bottom: 8px; }
      .gym-alerta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .gym-trilho { flex: 1; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
      .gym-trilho div { height: 100%; width: 0; }
      .gym-linha { display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; margin: 6px 0; }
      .gym-linha input { grid-column: 1 / 3; width: 100%; }
      .gym-linha b { font-weight: 600; color: #f0d29a; }
      .gym-botoes { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
      .gym-botoes button { font: inherit; padding: 4px 7px; border-radius: 5px; border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(255, 255, 255, 0.06); color: inherit; cursor: pointer; }
      .gym-botoes button.gym-ativo { background: rgba(224, 88, 58, 0.35); border-color: rgba(224, 88, 58, 0.7); }
      .gym-url { width: 100%; box-sizing: border-box; font: 11px ui-monospace, Menlo, monospace; background: rgba(0, 0, 0, 0.4); color: #b8c2cc; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 4px; padding: 4px; }
      .pausa { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.72); color: rgba(235, 235, 230, 0.85); font-family: -apple-system, "Segoe UI", sans-serif; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 30; }
      .pausa.visivel { opacity: 1; pointer-events: auto; }
      .pausa-painel { width: min(420px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; display: flex; flex-direction: column; gap: 22px; }
      .pausa-titulo { text-align: center; font-family: Georgia, "Times New Roman", serif; font-size: clamp(16px, 2.4vw, 26px); letter-spacing: 0.6em; margin-right: -0.6em; }
      .pausa-opcoes { display: flex; flex-direction: column; gap: 8px; }
      .pausa-opcoes button { font: inherit; font-size: 15px; letter-spacing: 0.08em; padding: 11px 14px; border-radius: 6px; border: 1px solid rgba(240, 210, 160, 0.25); background: rgba(255, 255, 255, 0.04); color: inherit; cursor: pointer; }
      .pausa-opcoes button:hover, .pausa-opcoes button:focus { outline: none; border-color: rgba(240, 200, 140, 0.85); background: rgba(240, 200, 140, 0.14); color: #fff; }
      .pausa-volumes { display: grid; gap: 10px; }
      .pausa-volumes label { display: grid; grid-template-columns: 9.5em 1fr; align-items: center; gap: 12px; font-size: 13px; color: rgba(235, 235, 230, 0.7); }
      .pausa-volumes input { width: 100%; accent-color: #e8c48a; }
      .pausa-controles { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 12px; color: rgba(220, 220, 215, 0.55); }
      .pausa-controles b { font-weight: 600; color: rgba(240, 220, 185, 0.8); }
      .pausa-botao { position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 700 14px -apple-system, sans-serif; letter-spacing: 1px; color: rgba(240, 225, 200, 0.75); background: rgba(20, 20, 24, 0.4); border: 1.5px solid rgba(240, 210, 160, 0.35); z-index: 25; user-select: none; touch-action: none; }
      @keyframes pulsa { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="carregando" class="carregando"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
